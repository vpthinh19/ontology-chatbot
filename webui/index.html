<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Trợ lý hỏi đáp học vụ dựa trên nguồn thông tin chính thức của Trường Đại học Nha Trang."
    />
    <meta name="theme-color" content="#111318" />
    <title>Trợ lý học vụ NTU</title>
    <!-- Chỉ tải các biểu tượng trang dùng (icon_names, xếp theo chữ cái); thêm biểu tượng thì thêm tên vào đây. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_upward,dark_mode,delete,light_mode,school,stop_circle&display=block"
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/account.css" />
  </head>
  <body>
    <div id="account" class="account-corner"></div>
    <main class="container">
      <section class="chats-container" aria-label="Hội thoại"></section>
      <p id="response-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></p>

      <footer class="prompt-container">
        <div class="prompt-wrapper">
          <form class="prompt-form">
            <label class="sr-only" for="prompt-input">Câu hỏi học vụ</label>
            <input
              id="prompt-input"
              type="text"
              placeholder="Nhập câu hỏi học vụ…"
              class="prompt-input"
              autocomplete="off"
              required
            />
            <div class="prompt-actions">
              <button
                id="stop-response-btn"
                type="button"
                class="icon-button material-symbols-rounded"
                aria-label="Dừng phản hồi"
                title="Dừng phản hồi"
              >stop_circle</button>
              <button
                id="send-prompt-btn"
                type="submit"
                class="icon-button primary material-symbols-rounded"
                aria-label="Gửi câu hỏi"
                title="Gửi câu hỏi"
                disabled
              >arrow_upward</button>
            </div>
          </form>
          <button
            id="theme-toggle-btn"
            type="button"
            class="icon-button material-symbols-rounded"
            aria-label="Đổi giao diện sáng tối"
            title="Đổi giao diện sáng tối"
          >light_mode</button>
          <button
            id="delete-chats-btn"
            type="button"
            class="icon-button material-symbols-rounded"
            aria-label="Xóa hội thoại"
            title="Xóa hội thoại"
            disabled
          >delete</button>
        </div>
        <p class="server-status" data-state="waking" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">Đang kết nối máy chủ</span><span
            class="connection-countdown"
            aria-hidden="true"
          > (5)</span>
        </p>
      </footer>
    </main>
    <script type="module" src="/script.js"></script>
  </body>
</html>
