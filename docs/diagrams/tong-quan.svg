<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="700" viewBox="0 0 1220 700" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <style>
      .khoi  { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .dam   { fill: #e9e9e9; stroke: #000000; stroke-width: 3; }
      .ten   { fill: #000000; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .phu   { fill: #444444; font-size: 15px; text-anchor: middle; }
      .nhan  { fill: #000000; font-size: 15px; text-anchor: middle; }
      .duong { stroke: #000000; stroke-width: 2.5; fill: none; marker-end: url(#mui); }
      .vung  { fill: none; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 9 7; }
      .tenvung { fill: #000000; font-size: 19px; font-weight: 700; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1220" height="700" fill="#ffffff"/>

  <text x="40" y="42" style="font-size:26px; font-weight:700; fill:#000000">Trợ lý học vụ NTU — hỏi đáp trên ontology có trích dẫn</text>

  <!-- ① Trả lời câu hỏi -->
  <rect x="40" y="64" width="1140" height="216" rx="14" class="vung"/>
  <text x="60" y="94" class="tenvung">① TRẢ LỜI CÂU HỎI — mỗi lượt hỏi</text>

  <g>
    <rect x="60"  y="112" width="185" height="92" rx="10" class="khoi"/>
    <text x="152" y="152" class="ten">Người dùng</text>
    <text x="152" y="176" class="phu">đặt câu hỏi</text>

    <rect x="288" y="112" width="185" height="92" rx="10" class="khoi"/>
    <text x="380" y="152" class="ten">Giao diện chat</text>
    <text x="380" y="176" class="phu">trình duyệt</text>

    <rect x="516" y="112" width="185" height="92" rx="10" class="dam"/>
    <text x="608" y="152" class="ten">API + Agent</text>
    <text x="608" y="176" class="phu">điều phối lượt hỏi</text>

    <rect x="744" y="112" width="185" height="92" rx="10" class="khoi"/>
    <text x="836" y="152" class="ten">Công cụ tra cứu</text>
    <text x="836" y="176" class="phu">tool của LLM</text>

    <rect x="972" y="112" width="185" height="92" rx="10" class="khoi"/>
    <text x="1064" y="152" class="ten">Search engine</text>
    <text x="1064" y="176" class="phu">BM25 trên ontology</text>
  </g>

  <path class="duong" d="M245 140 H284"/>
  <path class="duong" d="M473 140 H512"/>
  <path class="duong" d="M701 140 H740"/>
  <text x="721" y="105" class="nhan">từ khoá</text>
  <path class="duong" d="M929 140 H968"/>

  <!-- luồng về -->
  <path class="duong" d="M1064 204 V232 H152 V208"/>
  <text x="600" y="252" class="nhan">câu trả lời kèm trích dẫn · hiện dần trên giao diện</text>

  <!-- Ontology -->
  <rect x="790" y="340" width="370" height="112" rx="12" class="dam"/>
  <text x="975" y="382" class="ten" style="font-size:24px">ONTOLOGY — tệp TriG</text>
  <text x="975" y="410" class="phu" style="font-size:16px">mỗi phát biểu gắn nguồn trích dẫn</text>
  <text x="975" y="432" class="phu" style="font-size:16px">kèm lược đồ SHACL</text>

  <path class="duong" d="M1064 280 V336"/>
  <text x="1080" y="314" class="nhan" style="text-anchor:start">đọc</text>

  <path class="duong" d="M886 540 V456"/>
  <text x="870" y="502" class="nhan" style="text-anchor:end">ghi khi hợp lệ</text>

  <!-- ② Xây dựng tri thức -->
  <rect x="40" y="512" width="1140" height="150" rx="14" class="vung"/>
  <text x="60" y="542" class="tenvung">② XÂY DỰNG VÀ CẬP NHẬT TRI THỨC</text>

  <rect x="60"  y="556" width="200" height="86" rx="10" class="khoi"/>
  <text x="160" y="594" class="ten" style="font-size:19px">Văn bản chính thức</text>
  <text x="160" y="617" class="phu">quy chế · quyết định</text>

  <rect x="300" y="556" width="200" height="86" rx="10" class="khoi"/>
  <text x="400" y="594" class="ten" style="font-size:19px">Người biên soạn</text>
  <text x="400" y="617" class="phu">đối chiếu nguồn</text>

  <rect x="540" y="556" width="200" height="86" rx="10" class="khoi"/>
  <text x="640" y="594" class="ten" style="font-size:19px">Trang quản trị</text>
  <text x="640" y="617" class="phu">thêm · sửa · xoá</text>

  <rect x="786" y="556" width="200" height="86" rx="10" class="khoi"/>
  <text x="886" y="594" class="ten" style="font-size:19px">Kiểm tra SHACL</text>
  <text x="886" y="617" class="phu">sai lược đồ thì chặn</text>

  <path class="duong" d="M260 599 H296"/>
  <path class="duong" d="M500 599 H536"/>
  <path class="duong" d="M740 599 H782"/>
</svg>
