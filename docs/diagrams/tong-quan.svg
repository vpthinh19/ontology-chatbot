<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Noto Sans, sans-serif">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <style>
      .khoi { fill: #12467d; stroke: #3a78bd; stroke-width: 1.5; }
      .nhom { fill: #0e3963; stroke: #3a78bd; stroke-width: 1.5; }
      .buoc { fill: #1d5c9e; }
      .ten { fill: #ffffff; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .phu { fill: #bcd4f5; font-size: 13px; text-anchor: middle; }
      .nhan { fill: #e3edff; font-size: 12.5px; text-anchor: middle; }
      .duong { stroke: #ffffff; stroke-width: 2.2; fill: none; marker-end: url(#mui); }
      .vung { fill: none; stroke: #6f93c4; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .ten-vung { fill: #8fb8ef; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .net { stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dac { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="30" fill="#0a2342"/>

  <!-- Tiêu đề -->
  <rect x="40" y="34" width="470" height="122" rx="20" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="275" y="92" class="ten" style="font-size: 36px; letter-spacing: 1px">TRỢ LÝ HỌC VỤ NTU</text>
  <text x="275" y="128" class="phu" style="font-size: 18px">Hỏi đáp dựa trên ontology có nguồn trích dẫn</text>
  <text x="1540" y="92" class="nhan" style="text-anchor: end; font-size: 14px">Mũi tên trên: yêu cầu đi · Mũi tên dưới: kết quả về</text>

  <!-- ① Trả lời câu hỏi -->
  <rect x="40" y="186" width="1520" height="390" rx="22" class="vung"/>
  <text x="66" y="218" class="ten-vung">① TRẢ LỜI CÂU HỎI · MỖI LƯỢT HỎI</text>

  <!-- Người dùng -->
  <circle cx="120" cy="380" r="44" fill="#ffffff"/>
  <circle cx="120" cy="366" r="12" fill="#0a2342"/>
  <path d="M96 402 Q120 372 144 402 Z" fill="#0a2342"/>
  <text x="120" y="452" class="ten" style="font-size: 16px">Người dùng</text>

  <!-- Giao diện chat -->
  <rect x="250" y="330" width="170" height="100" rx="14" class="khoi"/>
  <g transform="translate(335 360)">
    <path class="net" d="M-18 -13 h36 a6 6 0 0 1 6 6 v15 a6 6 0 0 1 -6 6 h-18 l-10 8 v-8 h-8 a6 6 0 0 1 -6 -6 v-15 a6 6 0 0 1 6 -6 z"/>
    <circle cx="-9" cy="0" r="2.2" class="dac"/><circle cx="0" cy="0" r="2.2" class="dac"/><circle cx="9" cy="0" r="2.2" class="dac"/>
  </g>
  <text x="335" y="404" class="ten">Giao diện chat</text>
  <text x="335" y="421" class="phu">trình duyệt</text>

  <!-- API server -->
  <rect x="520" y="330" width="170" height="100" rx="14" class="khoi"/>
  <g transform="translate(605 360)">
    <rect class="net" x="-18" y="-18" width="36" height="10" rx="3"/>
    <rect class="net" x="-18" y="-5" width="36" height="10" rx="3"/>
    <rect class="net" x="-18" y="8" width="36" height="10" rx="3"/>
    <circle cx="-11" cy="-13" r="1.8" class="dac"/><circle cx="-11" cy="0" r="1.8" class="dac"/><circle cx="-11" cy="13" r="1.8" class="dac"/>
  </g>
  <text x="605" y="404" class="ten">API server</text>
  <text x="605" y="421" class="phu">HTTP · SSE</text>

  <!-- LLM Agent -->
  <rect x="790" y="312" width="190" height="142" rx="16" class="khoi" style="stroke: #7fb2ff; stroke-width: 2.5"/>
  <g transform="translate(885 354)">
    <rect class="net" x="-17" y="-17" width="34" height="34" rx="6"/>
    <path class="net" d="M-9 -17 v-6 M0 -17 v-6 M9 -17 v-6 M-9 17 v6 M0 17 v6 M9 17 v6 M-17 -9 h-6 M-17 0 h-6 M-17 9 h-6 M17 -9 h6 M17 0 h6 M17 9 h6"/>
    <path class="dac" d="M0 -10 L2.8 -2.8 L10 0 L2.8 2.8 L0 10 L-2.8 2.8 L-10 0 L-2.8 -2.8 Z"/>
  </g>
  <text x="885" y="406" class="ten">LLM Agent</text>
  <text x="885" y="424" class="phu">hiểu câu hỏi</text>
  <text x="885" y="440" class="phu">viết câu trả lời</text>

  <!-- Công cụ tra cứu -->
  <rect x="1080" y="330" width="170" height="100" rx="14" class="khoi"/>
  <g transform="translate(1165 358)">
    <path class="net" d="M8 -17 a10 10 0 0 0 -12 12 l-12 12 a3.5 3.5 0 0 0 5 5 l12 -12 a10 10 0 0 0 12 -12 l-6 6 l-5 -5 z"/>
  </g>
  <text x="1165" y="404" class="ten">Công cụ tra cứu</text>
  <text x="1165" y="421" class="phu">tool gọi theo từ khoá</text>

  <!-- Search engine -->
  <rect x="1340" y="222" width="205" height="330" rx="18" class="nhom"/>
  <g transform="translate(1372 256)">
    <circle class="net" cx="-2" cy="-2" r="8"/><path class="net" d="M4 4 L11 11"/>
  </g>
  <text x="1452" y="263" class="ten" style="font-size: 17px">Search engine</text>
  <rect x="1352" y="284" width="181" height="46" rx="10" class="buoc"/>
  <text x="1442" y="312" class="ten" style="font-size: 14px">Dựng chỉ mục</text>
  <rect x="1352" y="350" width="181" height="46" rx="10" class="buoc"/>
  <text x="1442" y="378" class="ten" style="font-size: 14px">Chấm điểm BM25</text>
  <rect x="1352" y="416" width="181" height="46" rx="10" class="buoc"/>
  <text x="1442" y="444" class="ten" style="font-size: 14px">Lấy 3 mục cao nhất</text>
  <rect x="1352" y="482" width="181" height="46" rx="10" class="buoc"/>
  <text x="1442" y="510" class="ten" style="font-size: 14px">Gom dữ kiện theo nguồn</text>
  <path class="duong" d="M1442 331 v17"/>
  <path class="duong" d="M1442 397 v17"/>
  <path class="duong" d="M1442 463 v17"/>

  <!-- Luồng đi (trên) và luồng về (dưới) -->
  <path class="duong" d="M166 362 H246"/>
  <text x="206" y="350" class="nhan">câu hỏi</text>
  <path class="duong" d="M250 400 H168"/>
  <text x="206" y="420" class="nhan">trả lời</text>

  <path class="duong" d="M420 362 H516"/>
  <text x="470" y="350" class="nhan">yêu cầu</text>
  <path class="duong" d="M520 400 H424"/>
  <text x="470" y="420" class="nhan">luồng sự kiện</text>

  <path class="duong" d="M690 362 H786"/>
  <text x="740" y="350" class="nhan">hội thoại</text>
  <path class="duong" d="M790 400 H694"/>
  <text x="740" y="420" class="nhan">câu trả lời</text>

  <path class="duong" d="M980 362 H1076"/>
  <text x="1030" y="350" class="nhan">gọi công cụ</text>
  <path class="duong" d="M1080 400 H984"/>
  <text x="1030" y="420" class="nhan">kết quả</text>

  <path class="duong" d="M1250 362 H1336"/>
  <text x="1295" y="350" class="nhan">từ khoá</text>
  <path class="duong" d="M1340 400 H1254"/>
  <text x="1295" y="420" class="nhan">3 mục</text>

  <!-- ② Xây dựng và cập nhật tri thức -->
  <rect x="40" y="604" width="1520" height="340" rx="22" class="vung"/>
  <text x="66" y="636" class="ten-vung">② XÂY DỰNG VÀ CẬP NHẬT TRI THỨC</text>

  <!-- Văn bản chính thức -->
  <rect x="80" y="720" width="200" height="110" rx="14" class="khoi"/>
  <g transform="translate(180 752)">
    <path class="net" d="M-13 -19 h16 l10 10 v28 h-26 z M3 -19 v10 h10"/>
    <path class="net" d="M-7 -1 h14 M-7 6 h14 M-7 13 h9"/>
  </g>
  <text x="180" y="800" class="ten">Văn bản chính thức</text>
  <text x="180" y="818" class="phu">quy chế · quyết định · web</text>

  <!-- Người biên soạn -->
  <rect x="380" y="720" width="190" height="110" rx="14" class="khoi"/>
  <g transform="translate(475 754)">
    <circle class="net" cx="0" cy="-5" r="7"/>
    <path class="dac" d="M-11 -9 a11 11 0 0 1 22 0 h3 v3 h-28 v-3 z"/>
    <path class="net" d="M-16 19 q16 -20 32 0"/>
  </g>
  <text x="475" y="800" class="ten">Người biên soạn</text>
  <text x="475" y="818" class="phu">đọc và đối chiếu nguồn</text>

  <!-- Trang quản trị -->
  <rect x="670" y="720" width="200" height="110" rx="14" class="khoi"/>
  <g transform="translate(770 752)">
    <rect class="net" x="-20" y="-18" width="40" height="36" rx="4"/>
    <path class="net" d="M-20 -9 h40"/>
    <rect class="net" x="-13" y="-3" width="26" height="6" rx="2"/>
    <rect class="net" x="-13" y="8" width="26" height="6" rx="2"/>
  </g>
  <text x="770" y="800" class="ten">Trang quản trị</text>
  <text x="770" y="818" class="phu">thêm · sửa · xoá (CRUD)</text>

  <!-- Kiểm tra SHACL -->
  <rect x="970" y="720" width="190" height="110" rx="14" class="khoi"/>
  <g transform="translate(1065 752)">
    <path class="net" d="M0 -20 L16 -13 V0 C16 10 8 17 0 20 C-8 17 -16 10 -16 0 V-13 Z"/>
    <path class="net" d="M-7 0 L-2 6 L8 -6"/>
  </g>
  <text x="1065" y="800" class="ten">Kiểm tra SHACL</text>
  <text x="1065" y="818" class="phu">đúng lược đồ mới ghi</text>

  <!-- Lược đồ -->
  <rect x="770" y="866" width="290" height="58" rx="12" class="nhom"/>
  <text x="915" y="901" class="ten" style="font-size: 16px">Lược đồ SHACL (shapes.ttl)</text>
  <path class="duong" d="M820 866 V834"/>
  <text x="812" y="856" class="nhan" style="text-anchor: end">sinh form</text>
  <path class="duong" d="M1010 866 V834"/>
  <text x="1018" y="856" class="nhan" style="text-anchor: start">luật kiểm tra</text>

  <!-- Ontology -->
  <rect x="1340" y="660" width="205" height="250" rx="18" class="khoi" style="stroke: #7fb2ff; stroke-width: 2.5"/>
  <g transform="translate(1442 745)">
    <path class="net" d="M0 0 L-38 -24 M0 0 L34 -28 M0 0 L-40 26 M0 0 L38 22 M0 0 L2 -44 M0 0 L6 42 M-38 -24 L2 -44 M34 -28 L38 22 M-40 26 L6 42" style="stroke-width: 1.6"/>
    <circle cx="0" cy="0" r="8" class="dac"/>
    <circle cx="-38" cy="-24" r="5.5" class="dac"/><circle cx="34" cy="-28" r="5.5" class="dac"/>
    <circle cx="-40" cy="26" r="5.5" class="dac"/><circle cx="38" cy="22" r="5.5" class="dac"/>
    <circle cx="2" cy="-44" r="5.5" class="dac"/><circle cx="6" cy="42" r="5.5" class="dac"/>
  </g>
  <text x="1442" y="830" class="ten" style="font-size: 20px">Ontology</text>
  <text x="1442" y="852" class="phu">tệp TriG: mỗi phát biểu</text>
  <text x="1442" y="870" class="phu">gắn nguồn trích dẫn</text>

  <!-- Nối hai vùng -->
  <path class="duong" d="M280 775 H376"/>
  <text x="328" y="762" class="nhan">đọc</text>
  <path class="duong" d="M570 775 H666"/>
  <text x="618" y="762" class="nhan">nhập liệu</text>
  <path class="duong" d="M870 765 H966"/>
  <text x="918" y="752" class="nhan">bản sửa</text>
  <path class="duong" d="M970 800 H874"/>
  <text x="918" y="820" class="nhan">lý do nếu sai</text>
  <path class="duong" d="M1160 775 H1336"/>
  <text x="1248" y="762" class="nhan">ghi tệp TriG</text>
  <path class="duong" d="M1442 660 V556"/>
  <text x="1430" y="598" class="nhan" style="text-anchor: end">đọc khi khởi động,</text>
  <text x="1430" y="614" class="nhan" style="text-anchor: end">nạp lại sau mỗi lần ghi</text>
</svg>
