<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="Noto Sans, sans-serif">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <style>
      .khoi { fill: #12467d; stroke: #3a78bd; stroke-width: 1.5; }
      .nhom { fill: #0e3963; stroke: #3a78bd; stroke-width: 1.5; }
      .vung { fill: none; stroke: #6f93c4; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .tieu { fill: #8fb8ef; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .ten { fill: #ffffff; font-size: 16px; font-weight: 700; }
      .giua { text-anchor: middle; }
      .phai { text-anchor: end; }
      .phu { fill: #bcd4f5; font-size: 13.5px; }
      .gt { fill: #ffffff; font-size: 14.5px; }
      .the { fill: #9ec5ff; font-size: 12.5px; font-weight: 700; }
      .so { fill: #ffe08a; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .di { stroke: #ffffff; stroke-width: 2; fill: none; marker-end: url(#mui); }
      .ke { stroke: #3a5f8f; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1200" rx="30" fill="#0a2342"/>

  <!-- A. Dựng chỉ mục -->
  <rect x="40" y="30" width="1520" height="330" rx="22" class="vung"/>
  <text x="66" y="62" class="tieu">A · KHI NẠP ONTOLOGY: DỰNG CHỈ MỤC</text>

  <rect x="70" y="150" width="190" height="90" rx="14" class="khoi"/>
  <text x="165" y="190" class="ten giua">Ontology</text>
  <text x="165" y="214" class="phu giua">tệp TriG</text>
  <path class="di" d="M260 195 H306"/>

  <rect x="310" y="92" width="770" height="236" rx="16" class="nhom"/>
  <text x="334" y="122" class="ten">Mỗi mục sinh ba loại dòng (giá trị không vào chỉ mục)</text>
  <text x="334" y="160" class="the">TÊN</text>
  <text x="470" y="160" class="gt">“bảo lưu kết quả học tập”</text>
  <text x="334" y="184" class="phu">nhãn và mỗi tên gọi khác</text>
  <text x="334" y="222" class="the">THUỘC TÍNH</text>
  <text x="470" y="222" class="gt">“Thủ tục nghỉ học tạm thời | nội dung”</text>
  <text x="334" y="246" class="phu">tên mục | tên thuộc tính chứa chữ, số, ngày</text>
  <text x="334" y="284" class="the">QUAN HỆ</text>
  <text x="470" y="284" class="gt">“Thủ tục nghỉ học tạm thời | nộp tại | Phòng Công tác Chính trị và Sinh viên”</text>
  <text x="334" y="308" class="phu">tên mục | tên quan hệ | tên mục đích</text>
  <path class="di" d="M1080 195 H1116"/>

  <rect x="1120" y="150" width="200" height="90" rx="14" class="khoi"/>
  <text x="1220" y="182" class="ten giua">Tách từ</text>
  <text x="1220" y="204" class="phu giua">âm tiết, chữ thường,</text>
  <text x="1220" y="222" class="phu giua">bỏ từ hỏi</text>
  <path class="di" d="M1320 195 H1356"/>

  <rect x="1360" y="150" width="180" height="90" rx="14" class="khoi" style="stroke: #7fb2ff; stroke-width: 2.5"/>
  <text x="1450" y="182" class="ten giua">Chỉ mục BM25</text>
  <text x="1450" y="206" class="phu giua">1.766 dòng</text>
  <text x="1450" y="224" class="phu giua">379 mục</text>

  <!-- B. Tìm -->
  <rect x="40" y="390" width="1520" height="780" rx="22" class="vung"/>
  <text x="66" y="422" class="tieu">B · MỖI LẦN GỌI CÔNG CỤ: TÌM</text>
  <text x="66" y="458" class="phu">Từ khoá do mô hình gửi:</text>
  <rect x="230" y="438" width="200" height="32" rx="16" class="khoi"/>
  <text x="330" y="459" class="gt giua">nghỉ học tạm thời</text>
  <rect x="444" y="438" width="240" height="32" rx="16" class="khoi"/>
  <text x="564" y="459" class="gt giua">bảo lưu kết quả học tập</text>

  <!-- Bước 1 -->
  <text x="66" y="512" class="ten">① Mỗi từ khoá tìm các dòng có chung từ, chấm điểm BM25</text>
  <rect x="66" y="528" width="700" height="170" rx="14" class="nhom"/>
  <text x="86" y="556" class="the">TỪ KHOÁ “nghỉ học tạm thời”</text>
  <text x="746" y="556" class="the phai">ĐIỂM</text>
  <text x="86" y="590" class="gt">“nghỉ học tạm thời” → Thủ tục nghỉ học tạm thời</text><text x="746" y="590" class="so phai">6,44</text>
  <text x="86" y="624" class="gt">“Thủ tục nghỉ học tạm thời” → cùng mục</text><text x="746" y="624" class="so phai">5,69</text>
  <text x="86" y="658" class="gt">“Mục tải: Đơn xin nghỉ học tạm thời” → mục tải biểu mẫu</text><text x="746" y="658" class="so phai">5,09</text>
  <text x="86" y="686" class="phu">… các dòng điểm thấp hơn</text>

  <rect x="834" y="528" width="700" height="170" rx="14" class="nhom"/>
  <text x="854" y="556" class="the">TỪ KHOÁ “bảo lưu kết quả học tập”</text>
  <text x="1514" y="556" class="the phai">ĐIỂM</text>
  <text x="854" y="590" class="gt">“bảo lưu kết quả học tập” → Thủ tục nghỉ học tạm thời</text><text x="1514" y="590" class="so phai">10,43</text>
  <text x="854" y="624" class="gt">“bảo lưu kết quả” → cùng mục</text><text x="1514" y="624" class="so phai">9,53</text>
  <text x="854" y="658" class="gt">“công nhận kết quả học tập” → Thủ tục công nhận kết quả…</text><text x="1514" y="658" class="so phai">5,97</text>
  <text x="854" y="686" class="phu">… các dòng điểm thấp hơn</text>

  <!-- Bước 2 -->
  <text x="66" y="746" class="ten">② Với từng từ khoá, mỗi mục chỉ giữ dòng điểm cao nhất; điểm của mục là tổng qua các từ khoá</text>
  <rect x="66" y="762" width="1468" height="196" rx="14" class="nhom"/>
  <text x="86" y="792" class="the">MỤC</text>
  <text x="1000" y="792" class="the phai">“nghỉ học tạm thời”</text>
  <text x="1250" y="792" class="the phai">“bảo lưu kết quả học tập”</text>
  <text x="1514" y="792" class="the phai">TỔNG</text>
  <line x1="86" y1="804" x2="1514" y2="804" class="ke"/>
  <text x="86" y="836" class="gt">Thủ tục nghỉ học tạm thời</text>
  <text x="1000" y="836" class="so phai">6,44</text><text x="1250" y="836" class="so phai">10,43</text><text x="1514" y="836" class="so phai">16,88</text>
  <text x="86" y="872" class="gt">Thủ tục công nhận kết quả học tập và chuyển đổi tín chỉ</text>
  <text x="1000" y="872" class="phu phai">—</text><text x="1250" y="872" class="so phai">5,97</text><text x="1514" y="872" class="so phai">5,97</text>
  <text x="86" y="908" class="gt">Mục tải: Đơn xin nghỉ học tạm thời</text>
  <text x="1000" y="908" class="so phai">5,09</text><text x="1250" y="908" class="phu phai">—</text><text x="1514" y="908" class="so phai">5,09</text>
  <text x="86" y="942" class="phu">Dòng 9,53 cùng mục, cùng từ khoá với dòng 10,43 nên không được cộng thêm: nhiều dòng không làm một mục tự tăng điểm.</text>

  <!-- Bước 3 và 4 -->
  <text x="66" y="1006" class="ten">③ Lấy 3 mục điểm cao nhất, không đặt ngưỡng</text>
  <rect x="66" y="1022" width="560" height="120" rx="14" class="nhom"/>
  <text x="86" y="1054" class="gt">1. Thủ tục nghỉ học tạm thời</text><text x="606" y="1054" class="so phai">16,88</text>
  <text x="86" y="1088" class="gt">2. Thủ tục công nhận kết quả học tập…</text><text x="606" y="1088" class="so phai">5,97</text>
  <text x="86" y="1122" class="gt">3. Mục tải: Đơn xin nghỉ học tạm thời</text><text x="606" y="1122" class="so phai">5,09</text>
  <path class="di" d="M626 1082 H686"/>

  <text x="690" y="1006" class="ten">④ Đọc hồ sơ từng mục: gom mọi câu theo túi, mỗi túi một trích dẫn</text>
  <rect x="690" y="1022" width="844" height="120" rx="14" class="nhom"/>
  <text x="710" y="1054" class="gt">khoản 3 Điều 24 Quy chế đào tạo… 1052/QĐ-ĐHNT</text><text x="1514" y="1054" class="phu phai">6 dữ kiện</text>
  <text x="710" y="1088" class="gt">điểm d khoản 1 Điều 24 Quy chế đào tạo… 1052/QĐ-ĐHNT</text><text x="1514" y="1088" class="phu phai">2 dữ kiện</text>
  <text x="710" y="1122" class="phu">… 8 nhóm nguồn cho mục đầu tiên → JSON gửi lại cho mô hình</text>
</svg>
