<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="780" viewBox="0 0 1220 780" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <style>
      .o    { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .odam { fill: #e9e9e9; stroke: #000000; stroke-width: 3; }
      .tieu { fill: #000000; font-size: 19px; font-weight: 700; }
      .tt   { fill: #000000; font-size: 17px; }
      .ma   { fill: #111111; font-size: 16px; font-family: "DejaVu Sans Mono", monospace; }
      .mui  { stroke: #000000; stroke-width: 2.5; fill: none; marker-end: url(#mui); }
      .diem { fill: #000000; font-size: 18px; font-weight: 700; text-anchor: end; }
    </style>
  </defs>

  <rect width="1220" height="780" fill="#ffffff"/>
  <text x="40" y="40" style="font-size:24px; font-weight:700">Từ vài từ khoá đến 3 mục: thuật toán tìm kiếm</text>
  <text x="40" y="66" style="font-size:15px; fill:#444">Điểm số thật của câu hỏi "em muốn xin nghỉ học".</text>

  <!-- B1 -->
  <rect x="40" y="84" width="1140" height="76" rx="10" class="o"/>
  <text x="60" y="112" class="tieu">1 · LLM gửi 3 từ khoá</text>
  <text x="60" y="142" class="ma">"nghỉ học tạm thời"   ·   "bảo lưu kết quả học tập"   ·   "xin nghỉ học"</text>
  <path class="mui" d="M610 160 V182"/>

  <!-- B2 -->
  <rect x="40" y="184" width="1140" height="76" rx="10" class="o"/>
  <text x="60" y="212" class="tieu">2 · Tách thành token theo âm tiết, bỏ hư từ</text>
  <text x="60" y="242" class="ma">[nghỉ · học · tạm · thời]   [bảo · lưu · kết · quả · học · tập]   [xin · nghỉ · học]</text>
  <path class="mui" d="M610 260 V282"/>

  <!-- B3 -->
  <rect x="40" y="284" width="1140" height="192" rx="10" class="odam"/>
  <text x="60" y="312" class="tieu">3 · BM25 chấm điểm từng dòng chỉ mục; mỗi từ khoá chỉ giữ DÒNG CAO NHẤT của mỗi mục</text>
  <text x="60" y="344" class="tt">Với mục <tspan font-weight="700">Thủ tục nghỉ học tạm thời</tspan>:</text>

  <rect x="60" y="358" width="900" height="34" rx="6" class="o"/>
  <text x="76" y="382" class="ma">"nghỉ học tạm thời"        → dòng tên  "nghỉ học tạm thời"</text>
  <text x="1140" y="382" class="diem">6,44</text>

  <rect x="60" y="398" width="900" height="34" rx="6" class="o"/>
  <text x="76" y="422" class="ma">"bảo lưu kết quả học tập"  → dòng tên  "bảo lưu kết quả học tập"</text>
  <text x="1140" y="422" class="diem">10,43</text>

  <rect x="60" y="438" width="900" height="34" rx="6" class="o"/>
  <text x="76" y="462" class="ma">"xin nghỉ học"             → dòng tên  "Thủ tục nghỉ học tạm thời"</text>
  <text x="1140" y="462" class="diem">2,74</text>

  <path class="mui" d="M610 476 V498"/>

  <!-- B4 -->
  <rect x="40" y="500" width="1140" height="80" rx="10" class="odam"/>
  <text x="60" y="528" class="tieu">4 · Cộng các điểm đó lại thành điểm của mục</text>
  <text x="60" y="562" class="ma">6,44  +  10,43  +  2,74  =  19,61</text>
  <text x="1160" y="562" style="font-size:15px; fill:#444; text-anchor:end">dòng "bảo lưu kết quả" 9,53 KHÔNG được cộng thêm</text>
  <path class="mui" d="M610 580 V602"/>

  <!-- B5 -->
  <rect x="40" y="604" width="1140" height="80" rx="10" class="o"/>
  <text x="60" y="632" class="tieu">5 · Lấy 3 mục điểm cao nhất, không đặt ngưỡng</text>
  <text x="60" y="664" class="ma">19,61 Thủ tục nghỉ học tạm thời  ·  8,19 Mục tải: Đơn xin…  ·  7,78 Mẫu số 09</text>
  <path class="mui" d="M610 684 V706"/>

  <!-- B6 -->
  <rect x="40" y="708" width="1140" height="62" rx="10" class="o"/>
  <text x="60" y="736" class="tieu">6 · Đọc hồ sơ từng mục, gom dữ kiện theo túi trích dẫn</text>
  <text x="60" y="760" class="tt">Mục đầu có 12 nhóm nguồn. Toàn bộ bước 1–6 mất 3,84 ms.</text>
</svg>
