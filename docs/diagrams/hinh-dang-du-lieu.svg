<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="880" viewBox="0 0 1220 880" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <style>
      .o    { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .odam { fill: #e9e9e9; stroke: #000000; stroke-width: 3; }
      .tieu { fill: #000000; font-size: 18px; font-weight: 700; }
      .ma   { fill: #111111; font-size: 16px; font-family: "DejaVu Sans Mono", monospace; white-space: pre; }
      .mui  { stroke: #000000; stroke-width: 2.5; fill: none; marker-end: url(#mui); }
    </style>
  </defs>

  <rect width="1220" height="880" fill="#ffffff"/>
  <text x="40" y="40" style="font-size:24px; font-weight:700">Dữ liệu có hình dạng gì ở mỗi bước của một lượt hỏi</text>

  <!-- 1 -->
  <rect x="40" y="62" width="1140" height="72" rx="10" class="o"/>
  <text x="60" y="88" class="tieu">1 · Câu hỏi - chuỗi văn bản</text>
  <text x="60" y="118" class="ma">em muốn xin nghỉ học</text>
  <path class="mui" d="M610 134 V156"/>

  <!-- 2 -->
  <rect x="40" y="158" width="1140" height="76" rx="10" class="o"/>
  <text x="60" y="184" class="tieu">2 · Yêu cầu tới API - JSON qua POST /chat</text>
  <text x="60" y="216" class="ma">{"message": "em muốn xin nghỉ học", "history": []}</text>
  <path class="mui" d="M610 234 V256"/>

  <!-- 3 -->
  <rect x="40" y="258" width="1140" height="100" rx="10" class="odam"/>
  <text x="60" y="284" class="tieu">3 · Lời gọi công cụ - JSON do LLM sinh ra</text>
  <text x="60" y="314" class="ma">{"name": "lookup_academic_information", "arguments": {"keywords": [</text>
  <text x="60" y="340" class="ma">   "nghỉ học tạm thời", "bảo lưu kết quả học tập", "xin nghỉ học"]}}</text>
  <path class="mui" d="M610 358 V380"/>

  <!-- 4 -->
  <rect x="40" y="382" width="1140" height="230" rx="10" class="odam"/>
  <text x="60" y="408" class="tieu">4 · Kết quả công cụ - JSON; đây là tất cả những gì LLM biết về quy định</text>
  <text x="60" y="438" class="ma">{"status": "found", "guidance": "Kiểm matched trước…", "results": [{</text>
  <text x="60" y="463" class="ma">   "label": "Thủ tục nghỉ học tạm thời",</text>
  <text x="60" y="488" class="ma">   "classes": ["Thủ tục học vụ"],</text>
  <text x="60" y="513" class="ma">   "matched": ["bảo lưu kết quả học tập", "nghỉ học tạm thời"],</text>
  <text x="60" y="538" class="ma">   "sources": [{"citation": "khoản 3 Điều 24 Quy chế…1052/QĐ-ĐHNT",</text>
  <text x="60" y="563" class="ma">      "url": "https://pdtdaihoc.ntu.edu.vn/…pdf", "facts": [</text>
  <text x="60" y="588" class="ma">         {"subject": "…", "property": "cần biểu mẫu", "value": "Mẫu số 09"}]}]}]}</text>
  <path class="mui" d="M610 612 V634"/>

  <!-- 5 -->
  <rect x="40" y="636" width="1140" height="128" rx="10" class="o"/>
  <text x="60" y="662" class="tieu">5 · Sự kiện về giao diện - các dòng SSE nối nhau</text>
  <text x="60" y="692" class="ma">data: {"type": "lookup_started", "keywords": "nghỉ học tạm thời · …"}</text>
  <text x="60" y="717" class="ma">data: {"type": "text_delta", "content": "…một đoạn câu trả lời…"}</text>
  <text x="60" y="742" class="ma">data: {"type": "completed", "content": "Để xin nghỉ học tạm thời…"}</text>
  <path class="mui" d="M610 764 V786"/>

  <!-- 6 -->
  <rect x="40" y="788" width="1140" height="72" rx="10" class="o"/>
  <text x="60" y="814" class="tieu">6 · Câu trả lời - Markdown, kèm trích dẫn và đường dẫn văn bản gốc</text>
  <text x="60" y="844" class="ma">Bạn cần **Mẫu số 09 - Đơn xin nghỉ học tạm thời** … (khoản 3 Điều 24 …)</text>
</svg>
