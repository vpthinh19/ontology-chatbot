name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests may discard obsolete checks. A main-branch run may already be
  # publishing immutable release assets and must be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: vpt19/ontchatbot
  # Kho phát hành giữ đồ thị ONNX của bộ phân loại; ảnh triển khai tải từ đây lúc
  # dựng. Đẩy lên bằng lệnh `publish_classifier`, lệnh đó kiểm lại bằng mã băm.
  HF_MODEL_REPO: vpthinh19/ntu-ontology-xlmr

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (inference extra + dev)
        run: uv sync --frozen --extra inference --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Install frontend dependencies and browser
        working-directory: webui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and test the frontend
        working-directory: webui
        run: npm test

  check-version:
    name: Detect version bump
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        name: Release only if pyproject version is not yet tagged
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version *= *"(.+)"/\1/')
          echo "pyproject version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The tag v$VERSION already exists - skip the release (bump the version in pyproject.toml to release)."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION has no tag yet - proceed with build and release."
          fi

  release:
    name: Build, scan, push, tag
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: vpt19
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: model
        name: Resolve the released classifier graph
        run: |
          REPO="${{ env.HF_MODEL_REPO }}"
          REVISION=$(curl -sf "https://huggingface.co/api/models/$REPO" | jq -r .sha)
          if [ -z "$REVISION" ] || [ "$REVISION" = "null" ]; then
            echo "::error::Failed to resolve HF Hub revision"
            exit 1
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "::notice::Baking classifier revision $REVISION"

      - name: Build image (load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HF_REPO=${{ steps.model.outputs.repo }}
            HF_REVISION=${{ steps.model.outputs.revision }}

      - name: Record image size and layers
        run: |
          BYTES=$(docker image inspect --format '{{.Size}}' "$IMAGE:$VERSION")
          echo "Uncompressed image bytes: $BYTES"
          docker history --no-trunc "$IMAGE:$VERSION"
          docker system df
          df -h /

      - name: Verify the CPU runtime
        run: sh .github/scripts/verify-cpu-runtime.sh "$IMAGE:$VERSION"

      - name: Smoke test the runtime image
        run: |
          CONTAINER=ontchatbot-smoke-${{ github.run_id }}
          # Dịch vụ đòi tên mô hình ngôn ngữ lớn và khoá truy cập ngay lúc khởi
          # động, nhưng /health không gọi ra ngoài, nên giá trị giả là đủ và
          # phép chạy thử này không tiêu một lượt gọi nào. Nó kiểm được ảnh dựng
          # xong có nạp nổi đồ thị phân loại và ontology rồi phục vụ hay không;
          # nó KHÔNG kiểm được chất lượng câu trả lời.
          docker run --detach --name "$CONTAINER" \
            --env ONTCHATBOT_LLM_MODEL=ci-smoke-test \
            --env ONTCHATBOT_LLM_API_KEY=ci-smoke-test \
            --env ONTCHATBOT_BACKEND_TOKEN=ci-smoke-test \
            --publish 127.0.0.1:8000:8000 \
            "${{ env.IMAGE }}:${{ env.VERSION }}"
          # shellcheck disable=SC2329  # Hàm được gọi gián tiếp bởi trap EXIT.
          cleanup() {
            docker logs "$CONTAINER" || true
            docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent \
              --header 'Authorization: Bearer ci-smoke-test' \
              http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$CONTAINER" | grep -qx true; then
              echo "Container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Container did not become healthy within 120 seconds" >&2
          exit 1

      - name: Trivy vulnerability scan (OS only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os
          ignore-unfixed: true

      - name: Push image
        run: |
          docker tag ${{ env.IMAGE }}:${{ env.VERSION }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ env.VERSION }}
          docker push ${{ env.IMAGE }}:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            Docker image: `${{ env.IMAGE }}:${{ env.VERSION }}`
            Baked classifier: [`${{ steps.model.outputs.repo }}@${{ steps.model.outputs.revision }}`](https://huggingface.co/${{ steps.model.outputs.repo }}/commit/${{ steps.model.outputs.revision }})

            Pull:
            ```
            docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
            docker run -p 8000:8000 \
              -e ONTCHATBOT_LLM_MODEL=<model> \
              -e ONTCHATBOT_LLM_API_KEY=<llm-key> \
              -e ONTCHATBOT_BACKEND_TOKEN=<random-token> \
              ${{ env.IMAGE }}:${{ env.VERSION }}
            ```
