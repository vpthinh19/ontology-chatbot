[project]
name = "ontchatbot"
version = "0.3.0"
description = "Vietnamese chatbot generating SPARQL over an RDF ontology"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ctranslate2>=4.8.1",
    "numpy>=2.5.1",
    "owlrl>=7.6.2",
    "rdflib>=7.6.0",
    "sentencepiece>=0.2.2",
]

[project.optional-dependencies]
inference = [
    "fastapi[standard]>=0.140.0",
    "huggingface-hub>=1.24.0",
]
train = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "huggingface-hub>=1.24.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
migrate_ontology_v11 = "ontchatbot.scripts.migrate_ontology_v11:main"
prepare_vit5_tokenizer = "ontchatbot.scripts.prepare_vit5_tokenizer:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.uv]
package = true
conflicts = [
    [{ extra = "train" }, { extra = "inference" } ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]
