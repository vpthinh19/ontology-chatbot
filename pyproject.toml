[project]
name = "ontchatbot"
version = "3.2.0"
description = "Vietnamese academic-regulation chatbot: a classifier picks one of 344 predefined SPARQL queries over an ontology"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "numpy>=2.5.1",
    "oxrdflib>=0.5.0",
    # Đường phục vụ nhập thẳng ``pyoxigraph``. Trước nó chỉ tới đây nhờ đi kèm
    # ``oxrdflib``; ngày nào gói kia nới ràng buộc là ảnh triển khai dựng xong
    # vẫn chết ngay lúc khởi động, mà không phép kiểm nào thấy trước.
    "pyoxigraph>=0.5.0",
    "pyparsing>=3.2.0",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
inference = [
    "httpx>=0.28.0",
    "onnxruntime>=1.29.0",
    "starlette>=0.47.0",
    "tokenizers>=0.22.2",
    "uvicorn>=0.41.0",
]
research = [
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.0",
    "onnx>=1.20.0",
    # Cùng sàn với extra ``inference``: đồ thị nướng sẵn được ghi ở đây và đọc ở
    # đó, nên hai bên lệch bản bộ chạy thì lỗi chỉ lộ ra trong container.
    "onnxruntime>=1.29.0",
    "onnxscript>=0.5.0",
    "peft>=0.20.0",
    "playwright>=1.56.0",
    "protobuf>=6.33.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
bake_cards = "ontchatbot.cli.bake_cards:main"
benchmark_classifier = "ontchatbot.cli.benchmark_classifier:main"
benchmark_runtime = "ontchatbot.cli.benchmark_runtime:main"
chat_agent = "ontchatbot.cli.chat:main"
check_conditions = "ontchatbot.cli.check_conditions:main"
generate_reports = "ontchatbot.cli.report:main"
report_page = "ontchatbot.cli.report_page:main"
serve_sparql = "ontchatbot.cli.serve:main"
export_classifier = "ontchatbot.cli.export_classifier:main"
publish_classifier = "ontchatbot.cli.publish_classifier:main"
train_classifier = "ontchatbot.cli.train_classifier:main"
validate_sparql_dataset = "ontchatbot.cli.validate_data:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-n", "auto", "--dist", "loadfile"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]
