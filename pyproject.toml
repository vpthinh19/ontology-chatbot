[project]
name = "ontchatbot"
version = "0.4.1"
description = "Vietnamese chatbot generating SPARQL over an RDF ontology"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ctranslate2>=4.8.1",
    "numpy>=2.5.1",
    "owlrl>=7.6.2",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
inference = [
    "fastapi[standard]>=0.140.0",
    "huggingface-hub>=1.24.0",
    "tokenizers>=0.22.2",
]
train = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "huggingface-hub>=1.24.0",
    "peft>=0.20.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.hatch.metadata]
# flash-attn khai bằng đường dẫn wheel trực tiếp; hatchling chặn kiểu khai đó
# trừ khi được cho phép tường minh.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
benchmark_sparql = "ontchatbot.cli.benchmark:main"
convert_sparql_model = "ontchatbot.cli.convert_model:main"
evaluate_ct2_model = "ontchatbot.cli.evaluate_ct2:main"
evaluate_sparql_model = "ontchatbot.cli.evaluate_model:main"
generate_reports = "ontchatbot.cli.report:main"
generate_sparql_dataset = "ontchatbot.cli.generate_dataset:main"
prepare_vit5_tokenizer = "ontchatbot.cli.prepare_tokenizer:main"
serve_sparql = "ontchatbot.cli.serve:main"
train_sparql = "ontchatbot.cli.train:main"
validate_sparql_dataset = "ontchatbot.cli.validate_data:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.uv]
package = true
conflicts = [
    [{ extra = "train" }, { extra = "inference" } ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]
