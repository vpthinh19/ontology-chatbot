[project]
name = "ontchatbot"
version = "0.4.1"
description = "Vietnamese academic-regulation chatbot: a classifier picks one of 344 predefined SPARQL queries over an ontology"
readme = "README.md"
requires-python = "==3.12.*"

# Đọc và truy vấn ontology. Mọi lệnh đều cần phần này, kể cả khi không nạp model.
dependencies = [
    "numpy>=2.5.1",
    "oxrdflib>=0.5.0",
    "pyparsing>=3.2.0",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]

# Chạy dịch vụ: máy chủ HTTP, lớp giao tiếp gọi mô hình ngôn ngữ lớn, và bộ chạy
# đồ thị ONNX. KHÔNG có thư viện huấn luyện ở đây: bộ phân loại đã được đóng gói
# thành một đồ thị ONNX kèm sẵn trọng số, nên lúc chạy chỉ cần bộ chạy đồ thị và
# bộ tách từ. Đưa thư viện huấn luyện vào sẽ cộng thêm vài gigabyte cho ảnh triển
# khai mà không đổi kết quả.
#
# ``huggingface-hub`` chỉ dùng lúc dựng ảnh để tải model đã xuất về.
inference = [
    "fastapi[standard]>=0.140.0",
    "huggingface-hub>=1.24.0",
    "onnxruntime-gpu>=1.24.0",
    "openai-agents>=0.21.1",
    "tokenizers>=0.22.2",
]

# Huấn luyện, chấm điểm, dựng biểu đồ và xuất model sang ONNX. Đây là nhóm nặng
# nhất và chỉ cần trên máy làm thực nghiệm, không cần trên máy chạy dịch vụ.
research = [
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.0",
    "onnx>=1.20.0",
    "onnxscript>=0.5.0",
    "peft>=0.20.0",
    "protobuf>=6.33.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
]

# Dựng sơ đồ và chụp ảnh giao diện cho tài liệu.
docs = [
    "matplotlib>=3.11.0",
    "playwright>=1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
benchmark_classifier = "ontchatbot.cli.benchmark_classifier:main"
chat_agent = "ontchatbot.cli.chat:main"
check_conditions = "ontchatbot.cli.check_conditions:main"
generate_reports = "ontchatbot.cli.report:main"
report_page = "ontchatbot.cli.report_page:main"
serve_sparql = "ontchatbot.cli.serve:main"
export_classifier = "ontchatbot.cli.export_classifier:main"
train_classifier = "ontchatbot.cli.train_classifier:main"
validate_sparql_dataset = "ontchatbot.cli.validate_data:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]
