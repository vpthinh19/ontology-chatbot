[project]
name = "ontchatbot"
version = "2.1.0"
description = "Vietnamese academic-regulation chatbot: a classifier picks one of 344 predefined SPARQL queries over an ontology"
readme = "README.md"
requires-python = "==3.12.*"

# Đọc và truy vấn ontology. Mọi lệnh đều cần phần này, kể cả khi không nạp model.
dependencies = [
    "numpy>=2.5.1",
    "oxrdflib>=0.5.0",
    "pyparsing>=3.2.0",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
inference = [
    "fastapi[standard]>=0.140.0",
    "huggingface-hub>=1.24.0",
    "onnxruntime-gpu>=1.24.0",
    "openai-agents>=0.21.1",
    "tokenizers>=0.22.2",
]

# Huấn luyện, chấm điểm, xuất model sang ONNX, và dựng hình cho tài liệu. Đây là
# nhóm nặng nhất và chỉ cần trên máy làm thực nghiệm, không cần trên máy chạy dịch
# vụ. Bộ dựng hình nằm chung ở đây vì nó đọc kết quả do chính nhóm này sinh ra;
# tách riêng thì mỗi lần cài lại môi trường thực nghiệm là mất bộ chụp ảnh.
#
# ``onnxruntime`` bản CPU dùng để đối chiếu đồ thị vừa xuất với bản gốc PyTorch.
# Nó KHÁC gói mà nhóm ``inference`` cài, và hai gói cùng cung cấp một module.
research = [
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.0",
    "onnx>=1.20.0",
    "onnxruntime>=1.24.0",
    "onnxscript>=0.5.0",
    "peft>=0.20.0",
    "playwright>=1.56.0",
    "protobuf>=6.33.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
benchmark_classifier = "ontchatbot.cli.benchmark_classifier:main"
chat_agent = "ontchatbot.cli.chat:main"
check_conditions = "ontchatbot.cli.check_conditions:main"
generate_reports = "ontchatbot.cli.report:main"
report_page = "ontchatbot.cli.report_page:main"
serve_sparql = "ontchatbot.cli.serve:main"
export_classifier = "ontchatbot.cli.export_classifier:main"
publish_classifier = "ontchatbot.cli.publish_classifier:main"
train_classifier = "ontchatbot.cli.train_classifier:main"
validate_sparql_dataset = "ontchatbot.cli.validate_data:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = true

# ``inference`` và ``research`` không cài chung được: cả hai kéo về một gói
# ``onnxruntime`` nhưng là hai bản khác nhau, bản cho card và bản cho bộ xử lý
# trung tâm. Khai xung đột ở đây để công cụ báo ngay lúc phân giải, thay vì cài
# đè lên nhau rồi hỏng lúc chạy.
#
# Máy chạy dịch vụ dùng ``--extra inference``; máy làm thực nghiệm dùng
# ``--extra research``.
conflicts = [
    [{ extra = "inference" }, { extra = "research" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Chạy song song mặc định. Thời gian của bộ kiểm dồn vào một nhúm phép kiểm nặng
# đọc trọn tập dữ liệu và chạy nó qua đồ thị; chúng độc lập với nhau nên chia ra
# nhiều tiến trình là được ngay.
#
# ``loadfile`` chứ không phải cách chia mặc định: các phép nặng nằm chung tệp và
# dùng chung phần tính sẵn ở mức phiên, mà mỗi tiến trình con giữ một bản riêng.
# Rải chúng ra thì mỗi tiến trình lại phải tính lại từ đầu, và phần tính sẵn đó
# thành vô nghĩa. Giữ nguyên tệp trên một tiến trình thì cả hai cùng có lợi.
addopts = ["-n", "auto", "--dist", "loadfile"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]
