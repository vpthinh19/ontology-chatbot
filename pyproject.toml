[project]
name = "ontchatbot"
version = "0.4.1"
description = "Vietnamese chatbot generating SPARQL over an RDF ontology"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ctranslate2>=4.8.1",
    "numpy>=2.5.1",
    "oxrdflib>=0.5.0",
    "owlrl>=7.6.2",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
inference = [
    "fastapi[standard]>=0.140.0",
    "openai-agents>=0.21.1",
    "huggingface-hub>=1.24.0",
    "tokenizers>=0.22.2",
    # CTranslate2 nạp cuBLAS lúc chạy khi phục vụ trên card đồ hoạ. Bánh xe của
    # nó dựng trên CUDA 12, nên phải là bản cu12 kể cả khi máy chủ chạy driver
    # đời sau; driver mới vẫn chạy được thư viện đời trước. Thư viện của driver
    # (``libcuda``) đến từ máy chủ, không cài qua pip được.
    "nvidia-cublas-cu12>=12.9.0",
]
# Không khai flash-attention ở đây: bánh xe của nó chỉ dựng sẵn cho đúng một tổ
# hợp CUDA, torch, Python và hệ điều hành, nên khai thành phụ thuộc là buộc mọi
# máy phải khớp đúng tổ hợp đó. Với chuỗi tối đa 320 token thì khâu chú ý không
# phải phần tính toán nặng. Mã huấn luyện tự dùng nếu máy có sẵn.
train = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "huggingface-hub>=1.24.0",
    "peft>=0.20.0",
    "sentencepiece>=0.2.2",
    "torchao>=0.18.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
benchmark_model = "ontchatbot.cli.benchmark_model:main"
benchmark_sparql = "ontchatbot.cli.benchmark:main"
convert_sparql_model = "ontchatbot.cli.convert_model:main"
generate_reports = "ontchatbot.cli.report:main"
prepare_vit5_tokenizer = "ontchatbot.cli.prepare_tokenizer:main"
chat_agent = "ontchatbot.cli.chat:main"
serve_sparql = "ontchatbot.cli.serve:main"
try_model = "ontchatbot.cli.try_model:main"
report_page = "ontchatbot.cli.report_page:main"
internal_eval = "ontchatbot.cli.internal_eval:main"
check_conditions = "ontchatbot.cli.check_conditions:main"
train_sparql = "ontchatbot.cli.train:main"
train_llm_lora = "ontchatbot.cli.train_llm_lora:main"
validate_sparql_dataset = "ontchatbot.cli.validate_data:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.uv]
package = true
conflicts = [
    [{ extra = "train" }, { extra = "inference" } ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]
