# ---------------------------------------------------------------------------
# Package
# ---------------------------------------------------------------------------

[project]
name = "ontchatbot"
version = "3.2.0"
description = "Vietnamese academic-regulation chatbot: a classifier picks one of 344 predefined SPARQL queries over an ontology"
readme = "README.md"
requires-python = "==3.12.*"

# Only what both the deployed service and the offline tooling need: the
# Oxigraph store the serving path queries, and array handling for the
# classifier. rdflib and its SPARQL parser are offline-only and live in the
# research extra, so they never reach the container image.
dependencies = [
    "numpy>=2.5.1",
    "pyoxigraph>=0.5.0",
]

# ---------------------------------------------------------------------------
# Extras
# ---------------------------------------------------------------------------

[project.optional-dependencies]

# Everything the deployed service needs, and nothing more: this is what enters
# the container image, so every package added here costs image size and cold
# start time.
inference = [
    "httpx>=0.28.0",
    "onnxruntime>=1.29.0",
    "starlette>=0.47.0",
    "tokenizers>=0.22.2",
    "uvicorn>=0.41.0",
]

# Training, model export, scoring and report building. Never enters the
# container image.
#
# rdflib is here rather than in the core dependencies because only the offline
# tooling walks the graph triple by triple; oxrdflib backs it with the same
# Oxigraph store, and pyparsing is what its SPARQL parser is built on.
#
# The onnxruntime floor matches the inference extra: the pre-fused classifier
# graph is written by the runtime here and read by the runtime there.
research = [
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.0",
    "onnx>=1.20.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.5.0",
    "oxrdflib>=0.5.0",
    "peft>=0.20.0",
    "playwright>=1.56.0",
    "protobuf>=6.33.0",
    "pyparsing>=3.2.0",
    "rdflib>=7.6.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
]

# ---------------------------------------------------------------------------
# Command-line entry points
# ---------------------------------------------------------------------------

[project.scripts]
bake_cards = "ontchatbot.cli.bake_cards:main"
benchmark_classifier = "ontchatbot.cli.benchmark_classifier:main"
benchmark_runtime = "ontchatbot.cli.benchmark_runtime:main"
chat_agent = "ontchatbot.cli.chat:main"
check_conditions = "ontchatbot.cli.check_conditions:main"
export_classifier = "ontchatbot.cli.export_classifier:main"
generate_reports = "ontchatbot.cli.report:main"
publish_classifier = "ontchatbot.cli.publish_classifier:main"
report_page = "ontchatbot.cli.report_page:main"
serve_sparql = "ontchatbot.cli.serve:main"
train_classifier = "ontchatbot.cli.train_classifier:main"
validate_sparql_dataset = "ontchatbot.cli.validate_data:main"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontchatbot"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------

# The suite covers the offline tooling as well as the service, so it needs the
# graph libraries even when the heavyweight research extra is not installed.
[dependency-groups]
dev = [
    "oxrdflib>=0.5.0",
    "pyparsing>=3.2.0",
    "pytest>=9.1.0",
    "pytest-xdist>=3.8.0",
    "rdflib>=7.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-n", "auto", "--dist", "loadfile"]
